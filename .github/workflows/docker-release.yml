name: Docker Build & Release

# hotify-bridge 镜像 release CI —— 多架构（amd64+arm64）同时推 GHCR（海外）+ 阿里云 ACR（国内）。
# 打 tag (v*) → buildx 出多架构镜像 → 推两个 registry；workflow_dispatch → 只构建不推（测构建）。
#   - GHCR：公开仓用 GITHUB_TOKEN 免 secret，给海外 / 能连 ghcr 的用户。
#   - ACR：国内拉取（ghcr 被墙）；需 ACR_USERNAME / ACR_PASSWORD 两个 secret。没配 → ACR 步骤跳过，不影响 GHCR。
# Dockerfile builder 走 --platform=$BUILDPLATFORM 原生跑 + GOARCH=$TARGETARCH 交叉编译，多架构不慢。
permissions:
  contents: read
  packages: write   # 推 GHCR 需要

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ════════════ GHCR（海外，始终）════════════
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR metadata
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sakura-lolipop/hotify-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push to GHCR（多架构，写 gha cache）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ════════════ 阿里云 ACR（国内，需 secret；没配则跳过，不影响上面 GHCR）════════════
      # registry 用新版个人版域名（crpi-xxx.personal.cr.aliyuncs.com），非老版 registry.cn-xxx.aliyuncs.com。
      # step 级 if 可判 secrets（job 级不行）→ secret 空时三步全跳过，GHCR 不受牵连。
      - name: Login to ACR
        if: ${{ github.event_name == 'push' && secrets.ACR_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: crpi-gi2hyqoir87c0lus.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: ACR metadata
        id: meta_acr
        if: ${{ github.event_name == 'push' && secrets.ACR_USERNAME != '' }}
        uses: docker/metadata-action@v5
        with:
          images: crpi-gi2hyqoir87c0lus.cn-hangzhou.personal.cr.aliyuncs.com/sakura-lolipop/hotify-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push to ACR（多架构，复用 gha cache）
        if: ${{ github.event_name == 'push' && secrets.ACR_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_acr.outputs.tags }}
          labels: ${{ steps.meta_acr.outputs.labels }}
          cache-from: type=gha   # 只读复用 GHCR 那次的缓存，不重复写
