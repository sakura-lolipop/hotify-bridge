name: Docker Build & Release

# hotify-bridge 镜像 release CI —— 补 go-release.yml(二进制)/release.yml(Python) 的缺位。
# 打 tag (v*) → 多阶段 Dockerfile + buildx 出 linux/amd64+arm64 多架构镜像 → 推 GHCR。
#   公开仓用自带 GITHUB_TOKEN 直推 ghcr.io/sakura-lolipop/hotify-bridge，免额外 secret。
# workflow_dispatch → 只构建不推（push:false），先验多架构构建通不通。
# 与 go-release.yml / release.yml 同 tag 触发：三者并发各自出产物，互不干扰。
# Dockerfile builder 走 --platform=$BUILDPLATFORM 原生跑 + GOARCH=$TARGETARCH 交叉编译 → 不用 QEMU 编 Go，多架构不慢。
permissions:
  contents: read
  packages: write   # 推 GHCR 需要（packages: write）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 多架构构建依赖：QEMU 模拟（runtime 镜像 alpine arm64 拉取/解包需要）+ buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动出 tag + OCI labels：v1.2.3 → :1.2.3 / :1.2 / :latest / :sha-xxxxxxx
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sakura-lolipop/hotify-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push（多架构）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # dispatch 手动触发只构建不推（测构建）；tag 触发才推
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
