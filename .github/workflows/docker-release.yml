name: Docker Build & Release

# hotify-bridge 镜像 release CI：多架构（amd64+arm64）推 GHCR（海外）+ 阿里云 ACR（国内）。
# 两个独立 job 并行：GHCR / ACR 各自构建+推 → ACR 挂了不牵连 GHCR。
# 打 tag(v*) → 两边都推；workflow_dispatch → 两边都只构建不推（纯烟测；发版打 tag，免污染 :latest）。
# ⚠️ step/job 级 if 不能用 secrets.*（GitHub 解析报错 Unrecognized named-value: 'secrets'，实测踩过）。
#    所以不靠 secrets 做条件；ACR 凭证不对时 ACR job 自己红，GHCR job 不受影响。
permissions:
  contents: read
  packages: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ════════════ GHCR（海外）════════════
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sakura-lolipop/hotify-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push to GHCR（多架构，海外；写 gha cache）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════ 阿里云 ACR（国内）════════════
  # registry 用新版个人版域名（crpi-xxx.personal.cr.aliyuncs.com），非老版 registry.cn-xxx.aliyuncs.com。
  acr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-gi2hyqoir87c0lus.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: ACR metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: crpi-gi2hyqoir87c0lus.cn-hangzhou.personal.cr.aliyuncs.com/sakura-lolipop/hotify-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push to ACR（多架构，国内；复用 gha cache 只读）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}   # 仅 tag push 推（dispatch 只构建不推，免污染国内 :latest；与 GHCR job 对齐）
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
