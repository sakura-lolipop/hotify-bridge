name: Gitee Release（二进制镜像）

# GitHub Releases 国内被墙 → 把 Go 二进制镜像到 Gitee Release（国内可达），供"免 Docker"用户下载。
# 用 curl 直调 Gitee API（不走第三方 action——那个 action 的 requests 全没 timeout，attach 一 stall 永久挂）。
# 关键：每个 curl 都带 --connect-timeout + --max-time（砍挂起）+ --retry（自愈瞬时 stall）。token 只在本 workflow 内，不经第三方。
# 流程：删旧 release（清残骸/避重名）→ 建新 → 传 5 个 Go 二进制。只发 Go（Python fallback 不上 Gitee）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要传到 Gitee Release 的 tag（如 v1.1.0）'
        required: true

permissions:
  contents: read

jobs:
  gitee-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 兜底：5 文件 × (180s + 重试) 最坏 ~25min，别拖到 6h
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      API: https://gitee.com/api/v5/repos/sakura-lolipop/hotify-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build（交叉编译 5 平台 Go 静态二进制）
        working-directory: go
        run: bash build-all.sh

      - name: 删旧 → 建新 → 传二进制（curl，全带超时+重试）
        run: |
          set -e
          : "${GITEE_TOKEN:?GITEE_TOKEN secret 没配}"
          [ -n "$TAG" ] || { echo "❌ 没拿到 tag"; exit 1; }
          CT="--connect-timeout 10"

          # 1) 该 tag 若已有 release，先删（清之前残骸 + 避资产重名报错）
          OLD_RID=$(curl -sSL $CT --max-time 60 "$API/releases?access_token=$GITEE_TOKEN" \
            | jq -r ".[] | select(.tag_name==\"$TAG\") | .id" | head -1 || true)
          if [ -n "$OLD_RID" ]; then
            echo "删旧 release id=$OLD_RID（tag=$TAG）"
            curl -fsSL $CT --max-time 60 -X DELETE "$API/releases/$OLD_RID?access_token=$GITEE_TOKEN" >/dev/null \
              || echo "  (delete 非 2xx，可能已删/无权限，继续)"
          fi

          # 2) 建新 release
          RID=$(curl -fsSL $CT --max-time 60 -X POST "$API/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"hotify-bridge $TAG\",\"body\":\"Go 二进制（GitHub Releases 国内拉不动，此处镜像）。Docker 部署看 docker.md / README。\",\"target_commitish\":\"main\"}" \
            | jq -r '.id')
          echo "新 release_id=$RID"
          [ -n "$RID" ] || { echo "❌ 建 release 失败（看上面返回）"; exit 1; }

          # 3) 逐个传二进制（attach_files：multipart 字段名 file=，access_token 走 form field）
          #    --max-time 180 砍挂起（真 stall），--retry 3 自愈瞬时抖动。一个失败不连累其他。
          for f in gotify-bridge-linux-amd64 gotify-bridge-linux-arm64 gotify-bridge-windows-amd64.exe gotify-bridge-darwin-amd64 gotify-bridge-darwin-arm64; do
            echo "→ 上传 $f"
            curl -fsSL $CT --max-time 180 --retry 3 --retry-delay 5 \
              -X POST "$API/releases/$RID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@go/dist/$f" \
              | jq -r '.browser_download_url // "（无url）"' \
              || echo "  ⚠️ $f 传失败（继续下一个）"
          done
          echo "✅ Gitee Release $TAG 流程跑完"
