name: Gitee Release（二进制镜像）

# GitHub Releases 国内被墙 → 把 Go 二进制镜像到 Gitee Release（国内可达），供"免 Docker"用户下载。
# 用第三方 action nicennnnnnnlee/action-gitee-release（治本：Gitee API 正确性 + 上传重试交给它，不再手搓 curl 踩坑）。
# pin @v2.0.0（非 master）缓解供应链风险；它经手 GITEE_TOKEN（仅 projects 权限，泄露面小可吊销）。
# 只发 Go 二进制（Python fallback 不上 Gitee）。tag 触发 + dispatch(inputs.tag) 可补传。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要传到 Gitee Release 的 tag（如 v1.1.0）'
        required: true

permissions:
  contents: read

jobs:
  gitee-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build（交叉编译 5 平台 Go 静态二进制）
        working-directory: go
        run: bash build-all.sh

      - name: 建 Release（已存在则跳过，下一步上传）
        uses: nicennnnnnnlee/action-gitee-release@v2.0.0
        continue-on-error: true   # tag 已有 release → Gitee 报"该标签已存在发行版"，正常；upload_asset 接着传
        with:
          gitee_action: create_release
          gitee_owner: sakura-lolipop
          gitee_repo: hotify-bridge
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ env.TAG }}
          gitee_release_name: hotify-bridge ${{ env.TAG }}
          gitee_release_body: |
            Go 二进制（GitHub Releases 国内拉不动，此处镜像）。
            免 Docker 用户：下对应平台的包直接跑。Docker 部署看 docker.md / README。
          gitee_target_commitish: main

      - name: 上传二进制到 Release（按 tag 定位，新建/已有都吃）
        uses: nicennnnnnnlee/action-gitee-release@v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: sakura-lolipop
          gitee_repo: hotify-bridge
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ env.TAG }}
          gitee_upload_retry_times: 3
          gitee_files: |
            go/dist/gotify-bridge-linux-amd64
            go/dist/gotify-bridge-linux-arm64
            go/dist/gotify-bridge-windows-amd64.exe
            go/dist/gotify-bridge-darwin-amd64
            go/dist/gotify-bridge-darwin-arm64
